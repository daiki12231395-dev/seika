<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q-LINK - 新規登録</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn { animation: fadeIn 0.2s ease-out; }
  </style>
</head>
<body class="min-h-screen bg-[#faf8ff] flex flex-col justify-between items-center p-4 font-sans text-slate-800">

  <!-- ===== ヘッダー ===== -->
  <header class="w-full max-w-5xl py-6 px-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-[#0d9488] flex items-center justify-center text-white font-bold shadow-md">Q</div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-extrabold text-xl tracking-tight text-slate-900">Q-LINK</span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-teal-50 text-teal-700 border border-teal-200 font-medium">探究アプリ</span>
        </div>
        <p class="text-[11px] text-slate-400 font-medium">Field Adventure &amp; Quest Platform</p>
      </div>
    </div>
    <span class="text-xs bg-white text-slate-500 border border-slate-200 px-2.5 py-1 rounded-full shadow-sm">Ver 2.4</span>
  </header>

  <!-- ===== メインカード ===== -->
  <main class="w-full max-w-md my-auto">
    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-8">

      <!-- タイトル -->
      <div class="flex items-center gap-2 mb-7">
        <i data-lucide="user-plus" style="width:22px;height:22px;color:#0d9488"></i>
        <h1 class="font-extrabold text-xl text-slate-900">学校アカウント新規登録</h1>
      </div>

      <!-- エラー表示 -->
      <div id="form-error"
        class="hidden bg-rose-50 border border-rose-200 text-rose-600 text-xs px-3.5 py-2.5 rounded-xl flex items-center gap-2 animate-fadeIn mb-5">
        <i data-lucide="alert-circle" style="width:16px;height:16px;flex-shrink:0"></i>
        <span id="form-error-text"></span>
      </div>

      <form id="register-form" onsubmit="handleRegister(event)" class="space-y-5">

        <!-- 学校名 -->
        <div>
          <label class="block text-sm font-bold text-slate-900 mb-1.5">学校名</label>
          <input type="text" id="school-name" placeholder="例: 大阪市立桜丘中学校" required
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-[#0d9488]/30 focus:border-[#0d9488] text-sm text-slate-800 transition" />
        </div>

        <!-- 担当教員名 -->
        <div>
          <label class="block text-sm font-bold text-slate-900 mb-1.5">担当教員名</label>
          <input type="text" id="teacher-name" placeholder="例: 近藤 先生" required
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-[#0d9488]/30 focus:border-[#0d9488] text-sm text-slate-800 transition" />
        </div>

        <!-- パスワード -->
        <div>
          <label class="block text-sm font-bold text-slate-900 mb-1.5">パスワード</label>
          <div class="relative">
            <input type="password" id="password" placeholder="8文字以上16文字以下" required
              class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-[#0d9488]/30 focus:border-[#0d9488] text-sm text-slate-800 transition" />
            <button type="button" onclick="togglePw('password', 'eye1')"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1">
              <i id="eye1" data-lucide="eye-off" style="width:16px;height:16px"></i>
            </button>
          </div>
          <p class="text-[11px] text-slate-400 mt-1">※ 半角英数字・記号で8〜16文字</p>
        </div>

        <!-- パスワード確認 -->
        <div>
          <label class="block text-sm font-bold text-slate-900 mb-1.5">パスワード（確認）</label>
          <div class="relative">
            <input type="password" id="password-confirm" placeholder="もう一度入力してください" required
              class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-[#0d9488]/30 focus:border-[#0d9488] text-sm text-slate-800 transition" />
            <button type="button" onclick="togglePw('password-confirm', 'eye2')"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1">
              <i id="eye2" data-lucide="eye-off" style="width:16px;height:16px"></i>
            </button>
          </div>
        </div>

        <!-- 登録ボタン -->
        <button type="submit"
          class="w-full py-3.5 px-4 bg-[#0d9488] hover:bg-[#0f766e] text-white font-bold rounded-xl flex items-center justify-center gap-2 shadow-lg transition-all active:scale-[0.99]">
          <span>登録する</span>
          <i data-lucide="arrow-right" style="width:16px;height:16px"></i>
        </button>

        <!-- ログイン画面へ戻る -->
        <div class="text-center pt-1">
          <a href="index.html" class="text-xs text-slate-500 hover:text-slate-800 flex items-center justify-center gap-1">
            <i data-lucide="arrow-left" style="width:13px;height:13px"></i>
            ログイン画面に戻る
          </a>
        </div>

      </form>
    </div>
  </main>

  <!-- ===== フッター ===== -->
  <footer class="w-full py-6 text-center text-xs text-slate-400">
    © 2026 Q-LINK Fieldwork Quest System. All rights reserved.
  </footer>

  <script>
    lucide.createIcons();

    function togglePw(inputId, iconId) {
      const input = document.getElementById(inputId);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      const icon = document.getElementById(iconId);
      icon.setAttribute('data-lucide', isHidden ? 'eye' : 'eye-off');
      lucide.createIcons();
    }

    function handleRegister(e) {
      e.preventDefault();
      const school   = document.getElementById('school-name').value.trim();
      const teacher  = document.getElementById('teacher-name').value.trim();
      const pw       = document.getElementById('password').value;
      const pwConf   = document.getElementById('password-confirm').value;
      const errDiv   = document.getElementById('form-error');
      const errTxt   = document.getElementById('form-error-text');

      if (pw.length < 8 || pw.length > 16) {
        errTxt.textContent = 'パスワードは8文字以上16文字以下で設定してください。';
        errDiv.classList.remove('hidden');
        lucide.createIcons();
        return;
      }
      if (pw !== pwConf) {
        errTxt.textContent = 'パスワードと確認用パスワードが一致しません。';
        errDiv.classList.remove('hidden');
        lucide.createIcons();
        return;
      }

      errDiv.classList.add('hidden');
      localStorage.setItem('qlink_school',   school);
      localStorage.setItem('qlink_teacher',  teacher);
      localStorage.setItem('qlink_password', pw);
      window.location.href = 'setup.html';
    }
  </script>
</body>
</html>
