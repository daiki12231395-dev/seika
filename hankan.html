<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Q-LINK 班管理</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#00a88f',
              600: '#0b8471',
              700: '#0f766e',
              900: '#134e4a',
            },
            surface: { bg: '#f2f6f9', card: '#ffffff', sub: '#eef3f7' },
            alert:   { bg: '#fff1f2', border: '#fecdd3', text: '#f43f5e' }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    body { overscroll-behavior: none; background-color: #f2f6f9; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-surface-bg font-sans text-slate-800 flex flex-col min-h-screen">

  <!-- Header -->
  <header class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-xs">
    <div class="h-14 px-4 flex items-center justify-between max-w-2xl mx-auto">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-brand-500 text-white flex items-center justify-center font-bold text-lg shadow-sm">Q</div>
        <div class="flex flex-col">
          <div class="flex items-center gap-1.5">
            <span class="font-bold text-base text-slate-900 tracking-tight">Q-LINK</span>
            <span class="bg-brand-100 text-brand-700 text-[10px] font-bold px-2 py-0.5 rounded-full">教員・本部用</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button class="relative w-9 h-9 flex items-center justify-center rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors">
          <span class="material-symbols-outlined text-[20px]">notifications</span>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-alert-text rounded-full ring-2 ring-white"></span>
        </button>
        <span class="bg-brand-500 text-white text-xs font-bold px-2.5 py-1 rounded-full shadow-xs">本部</span>
        <button onclick="doLogout()" class="text-xs text-alert-text bg-alert-bg border border-alert-border px-2.5 py-1 rounded-full font-bold">ログアウト</button>
      </div>
    </div>
  </header>

  <!-- Toast -->
  <div id="save-toast" class="hidden fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-brand-700 text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg transition-all"></div>

  <!-- Main Content -->
  <main class="flex-1 max-w-2xl w-full mx-auto pt-16 pb-24 px-3 flex flex-col gap-3">

    <!-- Title -->
    <section class="pt-2 px-1 flex flex-col">
      <div class="flex items-center gap-2">
        <h1 class="text-xl font-bold text-slate-900 tracking-tight">班管理</h1>
        <span class="bg-brand-100 text-brand-700 text-xs px-2.5 py-0.5 rounded-full font-bold">班編成・名簿管理</span>
      </div>
      <p class="text-xs text-slate-500 mt-0.5">クラス別班編成および各班の班長・班員名簿を管理します</p>
    </section>

    <!-- Class Selector -->
    <section class="bg-white rounded-2xl shadow-sm border border-brand-500/20 overflow-hidden">
      <button id="class-toggle-btn" onclick="toggleClassDropdown()" class="w-full p-3 flex items-center justify-between bg-white hover:bg-slate-50 transition-colors text-left">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-brand-500 text-white flex items-center justify-center shadow-xs">
            <span class="material-symbols-outlined text-[20px]">school</span>
          </div>
          <div class="flex flex-col">
            <div class="flex items-center gap-2">
              <span id="current-class-title" class="font-bold text-base text-slate-900">読み込み中...</span>
              <span class="bg-brand-100 text-brand-700 text-[10px] px-2 py-0.5 rounded-full font-bold">選択中</span>
            </div>
            <span id="current-class-subtitle" class="text-xs text-slate-500">データ取得中...</span>
          </div>
        </div>
        <div class="flex items-center gap-1 text-brand-600 font-bold text-xs">
          <span>クラス切替</span>
          <span id="class-toggle-icon" class="material-symbols-outlined text-[20px] transition-transform duration-300">expand_more</span>
        </div>
      </button>
      <div id="class-dropdown-list" class="max-h-0 opacity-0 pointer-events-none transition-all duration-300 overflow-hidden divide-y divide-slate-100 bg-slate-50/50"></div>
    </section>

    <!-- Team Selector Tabs -->
    <section class="flex flex-col gap-2 pt-1">
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-1.5">
          <span class="material-symbols-outlined text-brand-600 text-[18px]">group</span>
          <span class="font-bold text-sm text-slate-800">班セレクター</span>
          <span id="roster-count-summary" class="text-xs text-slate-500">（全0班）</span>
        </div>
        <span id="active-team-indicator" class="text-xs font-bold text-brand-600">1班 表示中</span>
      </div>
      <div id="team-selector-tabs" class="flex items-center gap-2 overflow-x-auto pb-1 px-1"></div>
    </section>

    <!-- Selected Team Detail -->
    <section id="team-detail-section" class="bg-white rounded-2xl p-4 shadow-sm border border-brand-500/20 flex flex-col gap-3">
      <div class="flex items-start justify-between pb-3 border-b border-slate-100">
        <div class="flex flex-col gap-1">
          <div class="flex items-center gap-2">
            <span id="selected-team-num" class="w-7 h-7 rounded-lg bg-brand-500 text-white flex items-center justify-center font-bold text-xs">1</span>
            <h3 id="selected-team-title" class="text-lg font-bold text-slate-900 tracking-tight">-- 1班</h3>
          </div>
          <div class="flex items-center gap-1 text-xs text-slate-500">
            <span class="material-symbols-outlined text-[14px] text-brand-600">edit_note</span>
            <span>編集ボタンから班長・班員を登録できます</span>
          </div>
        </div>
        <button onclick="openEditModal()" class="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-brand-50 text-brand-600 font-bold text-xs hover:bg-brand-100 transition-all border border-brand-500/30">
          <span class="material-symbols-outlined text-[16px]">edit</span>
          <span>編集</span>
        </button>
      </div>

      <!-- Leader -->
      <div class="bg-brand-50/50 rounded-xl p-3 flex items-center justify-between border border-brand-500/20">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-brand-500 text-white flex items-center justify-center font-bold">
            <span class="material-symbols-outlined text-[20px]">person</span>
          </div>
          <div class="flex flex-col">
            <div class="flex items-center gap-1.5">
              <span class="bg-brand-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">班長</span>
              <span id="leader-name" class="font-bold text-slate-900 text-sm">未登録</span>
            </div>
            <span class="text-[11px] text-slate-500 mt-0.5">安全確認・通信端末管理担当</span>
          </div>
        </div>
      </div>

      <!-- Members Roster -->
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between px-0.5">
          <span id="roster-title-count" class="text-xs font-bold text-slate-800 flex items-center gap-1">
            <span class="material-symbols-outlined text-[16px] text-brand-600">badge</span>
            班員名簿（計 0 名）
          </span>
        </div>
        <div id="members-list-container" class="divide-y divide-slate-100 rounded-xl border border-slate-200/80 overflow-hidden bg-white min-h-[48px]">
          <div class="p-4 text-center text-xs text-slate-400">班員未登録。右上の「編集」から追加してください。</div>
        </div>
      </div>
    </section>

  </main>

  <!-- Navigation Bar -->
  <nav class="fixed bottom-0 w-full z-40 bg-white/95 backdrop-blur-md border-t border-slate-200">
    <div class="max-w-2xl mx-auto flex items-center justify-around h-16 px-2">
      <a href="tech.html" class="flex flex-col items-center justify-center w-16 h-full text-slate-400 hover:text-brand-600">
        <span class="material-symbols-outlined text-[22px]">map</span>
        <span class="text-[10px] font-bold mt-0.5">マップ</span>
      </a>
      <button class="flex flex-col items-center justify-center w-16 h-full text-brand-600 font-bold">
        <span class="material-symbols-outlined text-[22px]">groups</span>
        <span class="text-[10px] mt-0.5">班管理</span>
      </button>
      <button class="flex flex-col items-center justify-center w-16 h-full text-slate-400 hover:text-brand-600 relative">
        <span class="material-symbols-outlined text-[22px]">chat</span>
        <span class="absolute top-2 right-4 w-2 h-2 bg-alert-text rounded-full"></span>
        <span class="text-[10px] font-bold mt-0.5">連絡</span>
      </button>
      <button class="flex flex-col items-center justify-center w-16 h-full text-slate-400 hover:text-brand-600">
        <span class="material-symbols-outlined text-[22px]">settings</span>
        <span class="text-[10px] font-bold mt-0.5">設定</span>
      </button>
    </div>
  </nav>

  <!-- Team Edit Modal -->
  <div id="team-edit-modal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex flex-col justify-end transition-opacity duration-300 opacity-0 pointer-events-none">
    <div id="team-edit-container" class="w-full max-w-2xl mx-auto max-h-[85vh] bg-white rounded-t-2xl shadow-2xl flex flex-col transform transition-transform duration-300 translate-y-full overflow-hidden">
      <div class="px-4 py-3.5 border-b border-slate-100 flex items-center justify-between bg-slate-50">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-brand-100 text-brand-600 flex items-center justify-center">
            <span class="material-symbols-outlined text-[20px]">edit_note</span>
          </div>
          <div>
            <h2 id="edit-modal-title" class="font-bold text-sm text-slate-900">班編成・メンバー編集</h2>
            <p class="text-[11px] text-slate-500">出席番号・氏名・役割の変更ができます</p>
          </div>
        </div>
        <button onclick="closeEditModal()" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-200 transition-colors">
          <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
      </div>

      <div class="p-4 overflow-y-auto space-y-4 flex-1">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-bold text-slate-800">班員名簿編集</span>
          <button onclick="addNewMemberRow()" type="button" class="text-xs font-bold text-brand-600 flex items-center gap-1 hover:underline">
            <span class="material-symbols-outlined text-[16px]">person_add</span>追加
          </button>
        </div>

        <div id="editable-members-list" class="space-y-2.5"></div>

        <button type="button" onclick="saveTeamEdit()" class="w-full py-3 rounded-xl bg-brand-500 text-white font-bold text-sm shadow-md hover:bg-brand-600 transition-all flex items-center justify-center gap-1.5 mt-4">
          <span class="material-symbols-outlined text-[18px]">check_circle</span>
          <span>変更内容を保存する（sinki.csv に反映）</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // ── 状態管理 ──
    let appData = {};
    let currentSchool = '';
    let currentClass  = '';
    let currentTeamIndex = 1;

    // ── 起動時: 教師ロールチェック → データ読み込み ──
    window.addEventListener('DOMContentLoaded', async function() {
      if (localStorage.getItem('qlink_role') !== 'teacher') {
        window.location.href = 'index.html';
        return;
      }
      await loadData();
    });

    async function loadData() {
      try {
        const res = await fetch('/api/accounts');
        const accounts = await res.json();

        if (!accounts.length) {
          document.getElementById('current-class-title').innerText = '登録データなし';
          document.getElementById('current-class-subtitle').innerText = '先に新規登録を完了させてください';
          return;
        }

        // ログイン中の学校に合わせて選択
        const school  = localStorage.getItem('qlink_school') || accounts[0].school;
        const account = accounts.find(function(a) { return a.school === school; }) || accounts[0];

        currentSchool = account.school;
        const grade     = account.grade   || '';
        const classes   = Array.isArray(account.classes) ? account.classes : [];
        const rawGroups = Array.isArray(account.groups)  ? account.groups  : [];

        appData = {};
        classes.forEach(function(cls) {
          const fullClass = grade + cls.name;          // 例: "2年1組"
          const count     = parseInt(cls.groupCount) || 1;

          appData[fullClass] = {
            teacher: account.teacher || '担当教員',
            teams: {}
          };

          for (var g = 1; g <= count; g++) {
            var existing = rawGroups.find(function(gd) { return gd.cls === fullClass && gd.num === g; });
            appData[fullClass].teams[g] = existing ? (existing.members || []) : [];
          }
        });

        if (Object.keys(appData).length === 0) {
          document.getElementById('current-class-title').innerText = 'クラス未登録';
          document.getElementById('current-class-subtitle').innerText = '新規登録でクラス・班を設定してください';
          return;
        }

        initUI();

      } catch (err) {
        console.warn('API読み込み失敗、ダミーデータで起動:', err);
        currentSchool = '（オフライン）';
        appData = {
          "2年1組": {
            teacher: "担当教員",
            teams: {
              1: [{ no: "01", name: "佐藤 蓮", role: "班長", isLeader: true }],
              2: []
            }
          }
        };
        initUI();
      }
    }

    function initUI() {
      const classes = Object.keys(appData);
      if (!classes.length) return;
      currentClass = classes[0];
      renderClassDropdown();
      selectClassUI(currentClass);
    }

    function renderClassDropdown() {
      const dropdown = document.getElementById('class-dropdown-list');
      dropdown.innerHTML = Object.keys(appData).map(function(cls) {
        return '<button onclick="selectClass(\'' + cls + '\')" class="w-full px-3.5 py-2.5 flex items-center justify-between hover:bg-slate-100 transition-colors text-left">' +
          '<div class="flex items-center gap-3">' +
            '<div class="w-7 h-7 rounded-full bg-slate-200 text-slate-700 flex items-center justify-center text-xs font-bold">' + cls.replace(/[^0-9]/g, '').slice(-2) + '</div>' +
            '<div class="flex flex-col">' +
              '<span class="font-bold text-sm text-slate-800">' + cls + '</span>' +
              '<span class="text-[11px] text-slate-500">担任: ' + appData[cls].teacher + '</span>' +
            '</div>' +
          '</div>' +
          '<span class="material-symbols-outlined text-slate-400 text-[18px]">chevron_right</span>' +
        '</button>';
      }).join('');
    }

    function toggleClassDropdown() {
      const list = document.getElementById('class-dropdown-list');
      const icon = document.getElementById('class-toggle-icon');
      const isOpen = !list.classList.contains('max-h-0');
      if (isOpen) {
        list.classList.add('max-h-0', 'opacity-0', 'pointer-events-none');
        icon.style.transform = 'rotate(0deg)';
      } else {
        list.classList.remove('max-h-0', 'opacity-0', 'pointer-events-none');
        list.classList.add('max-h-64', 'opacity-100');
        icon.style.transform = 'rotate(180deg)';
      }
    }

    function selectClass(cls) {
      currentClass = cls;
      currentTeamIndex = 1;
      toggleClassDropdown();
      selectClassUI(cls);
    }

    function selectClassUI(cls) {
      var clsData  = appData[cls];
      var teamKeys = Object.keys(clsData.teams).map(Number).sort(function(a,b){ return a-b; });
      var total    = teamKeys.reduce(function(s, k) { return s + clsData.teams[k].length; }, 0);

      document.getElementById('current-class-title').innerText    = cls;
      document.getElementById('current-class-subtitle').innerText = '担任: ' + clsData.teacher + ' ／ 全' + teamKeys.length + '班';
      document.getElementById('roster-count-summary').innerText   = '（全' + teamKeys.length + '班・' + total + '名）';

      // タブ
      var tabs = document.getElementById('team-selector-tabs');
      tabs.innerHTML = teamKeys.map(function(t) {
        var active = t === currentTeamIndex;
        return '<button onclick="selectTeam(' + t + ')" class="flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold transition-all ' +
          (active ? 'bg-brand-500 text-white shadow-xs ring-2 ring-brand-500/30' : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200') + '">' +
          (active ? '<span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>' : '') +
          '<span>' + t + '班</span>' +
          '<span class="' + (active ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-500') + ' px-1.5 py-0.5 rounded-full text-[10px]">' + clsData.teams[t].length + '名</span>' +
        '</button>';
      }).join('');

      renderTeamDetail();
    }

    function selectTeam(teamNo) {
      currentTeamIndex = teamNo;
      selectClassUI(currentClass);
    }

    function renderTeamDetail() {
      var team   = (appData[currentClass] && appData[currentClass].teams[currentTeamIndex]) || [];
      var leader = team.find(function(m) { return m.isLeader; }) || null;

      document.getElementById('active-team-indicator').innerText = currentTeamIndex + '班 表示中';
      document.getElementById('selected-team-num').innerText     = currentTeamIndex;
      document.getElementById('selected-team-title').innerText   = currentClass + ' ' + currentTeamIndex + '班';
      document.getElementById('roster-title-count').innerHTML    =
        '<span class="material-symbols-outlined text-[16px] text-brand-600">badge</span> 班員名簿（計 ' + team.length + ' 名）';
      document.getElementById('leader-name').innerText = leader ? leader.name : '未登録';

      var container = document.getElementById('members-list-container');
      if (!team.length) {
        container.innerHTML = '<div class="p-4 text-center text-xs text-slate-400">班員未登録。右上の「編集」から追加してください。</div>';
        return;
      }
      container.innerHTML = team.map(function(m) {
        return '<div class="p-2.5 px-3 flex items-center justify-between hover:bg-slate-50 transition-colors">' +
          '<div class="flex items-center gap-3">' +
            '<span class="w-6 text-center font-mono text-xs font-bold text-slate-400">#' + (m.no || '-') + '</span>' +
            '<div class="flex flex-col">' +
              '<div class="flex items-center gap-2">' +
                '<span class="font-bold text-xs text-slate-800">' + m.name + '</span>' +
                (m.isLeader ? '<span class="bg-brand-100 text-brand-700 text-[9px] font-bold px-1 rounded">班長</span>' : '') +
              '</div>' +
              '<span class="text-[11px] text-slate-400">' + (m.role || '班員') + '</span>' +
            '</div>' +
          '</div>' +
          '<span class="text-[11px] font-bold text-brand-600 flex items-center gap-0.5">' +
            '<span class="material-symbols-outlined text-[13px]">check_circle</span>登録済' +
          '</span>' +
        '</div>';
      }).join('');
    }

    // ── モーダル ──
    function openEditModal() {
      document.getElementById('edit-modal-title').innerText = currentClass + ' ' + currentTeamIndex + '班 メンバー編集';
      renderEditableList();
      var modal     = document.getElementById('team-edit-modal');
      var container = document.getElementById('team-edit-container');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      container.classList.remove('translate-y-full');
    }

    function closeEditModal() {
      var modal     = document.getElementById('team-edit-modal');
      var container = document.getElementById('team-edit-container');
      container.classList.add('translate-y-full');
      modal.classList.add('opacity-0', 'pointer-events-none');
    }

    function renderEditableList() {
      var team = (appData[currentClass] && appData[currentClass].teams[currentTeamIndex]) || [];
      var list = document.getElementById('editable-members-list');
      list.innerHTML = team.map(function(m, idx) {
        return '<div class="p-2.5 bg-slate-50 rounded-xl border border-slate-200 flex flex-col gap-2">' +
          '<div class="flex items-center justify-between gap-2">' +
            '<div class="flex items-center gap-1.5 flex-1">' +
              '<span class="text-[11px] font-bold text-slate-500">No:</span>' +
              '<input type="text" value="' + (m.no || '') + '" onchange="updateMember(' + idx + ',\'no\',this.value)" class="w-12 text-center text-xs font-bold bg-white border border-slate-200 rounded-lg py-1 px-1">' +
              '<span class="text-[11px] font-bold text-slate-500 ml-1">氏名:</span>' +
              '<input type="text" value="' + m.name + '" onchange="updateMember(' + idx + ',\'name\',this.value)" class="flex-1 text-xs font-bold bg-white border border-slate-200 rounded-lg py-1 px-2">' +
            '</div>' +
            '<button type="button" onclick="removeMember(' + idx + ')" class="text-slate-400 hover:text-alert-text p-1">' +
              '<span class="material-symbols-outlined text-[18px]">delete</span>' +
            '</button>' +
          '</div>' +
          '<div class="flex items-center justify-between gap-2 pt-1 border-t border-slate-200 text-[11px]">' +
            '<input type="text" value="' + (m.role || '') + '" onchange="updateMember(' + idx + ',\'role\',this.value)" class="flex-1 text-xs bg-white border border-slate-200 rounded-lg py-0.5 px-2" placeholder="役割（例: 班長、書記）">' +
            '<label class="flex items-center gap-1 cursor-pointer ml-2">' +
              '<input type="radio" name="isLeader" ' + (m.isLeader ? 'checked' : '') + ' onchange="setLeader(' + idx + ')" class="accent-brand-500">' +
              '<span class="text-[10px] font-bold text-brand-600">班長</span>' +
            '</label>' +
          '</div>' +
        '</div>';
      }).join('');

      if (!team.length) {
        list.innerHTML = '<p class="text-xs text-slate-400 text-center py-2">追加ボタンから班員を追加してください</p>';
      }
    }

    function updateMember(idx, field, val) {
      if (appData[currentClass] && appData[currentClass].teams[currentTeamIndex] && appData[currentClass].teams[currentTeamIndex][idx]) {
        appData[currentClass].teams[currentTeamIndex][idx][field] = val;
      }
    }

    function setLeader(idx) {
      var team = appData[currentClass].teams[currentTeamIndex];
      team.forEach(function(m, i) { m.isLeader = (i === idx); });
      renderEditableList();
    }

    function addNewMemberRow() {
      if (!appData[currentClass].teams[currentTeamIndex]) {
        appData[currentClass].teams[currentTeamIndex] = [];
      }
      var team = appData[currentClass].teams[currentTeamIndex];
      team.push({ no: String(team.length + 1).padStart(2, '0'), name: '新規 生徒', role: '班員', isLeader: false });
      renderEditableList();
    }

    function removeMember(idx) {
      appData[currentClass].teams[currentTeamIndex].splice(idx, 1);
      renderEditableList();
    }

    async function saveTeamEdit() {
      closeEditModal();
      selectClassUI(currentClass);
      var ok = await saveToServer();
      showToast(ok ? '✅ 保存しました（sinki.csv に反映済み）' : '⚠ サーバー未接続：ローカル表示のみ更新');
    }

    // ── サーバー保存 (PUT /api/groups) ──
    async function saveToServer() {
      var groups = [];
      Object.keys(appData).forEach(function(cls) {
        Object.keys(appData[cls].teams).forEach(function(teamNo) {
          var num     = parseInt(teamNo);
          var members = appData[cls].teams[teamNo];
          var leader  = members.find(function(m) { return m.isLeader; });
          groups.push({
            cls:     cls,
            num:     num,
            leader:  leader ? leader.name : '',
            members: members
          });
        });
      });

      try {
        var res = await fetch('/api/groups', {
          method:  'PUT',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ school: currentSchool, groups: groups })
        });
        var data = await res.json();
        return !!data.success;
      } catch (err) {
        console.error('サーバー保存失敗:', err);
        return false;
      }
    }

    function showToast(msg) {
      var toast = document.getElementById('save-toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(function() { toast.classList.add('hidden'); }, 3000);
    }

    function doLogout() {
      localStorage.removeItem('qlink_role');
      localStorage.removeItem('qlink_school');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
