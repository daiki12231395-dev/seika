<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
            下書き編集中

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
<!-- ===== 左カラム: 探究対象・基本情報 & 解説文・写真 ===== -->
<div class="space-y-6">
<!-- 探究対象・基本情報カード -->
<section class="bg-white rounded-2xl p-5 border border-slate-200/90 shadow-xs space-y-4">
<div class="flex items-center justify-between pb-3 border-b border-slate-100">
<h2 class="font-bold text-sm text-slate-900 flex items-center gap-2">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="compass" aria-hidden="true" class="lucide lucide-compass w-4 h-4 text-[#0d9488]"><circle cx="12" cy="12" r="10"></circle><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"></path></svg>
<span class="">探究対象・基本情報</span>
</h2>
<span class="text-[11px] font-mono text-slate-500 bg-slate-100 px-2 py-0.5 rounded font-semibold">MISSION ID: #03</span>
</div>
<div class="space-y-3">
<div>
<div class="flex items-center justify-between mb-1">

<div class="relative">
<select class="w-full bg-slate-50/70 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#0d9488] appearance-none">
<option selected="">道頓堀・南エリア（ミナミ道頓堀川）</option>
<option>大阪城・天守閣周辺エリア</option>
<option>難波神社・上町台地エリア</option>
<option>適塾・緒方洪庵旧宅エリア</option>
</select>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="chevron-down" aria-hidden="true" class="lucide lucide-chevron-down w-4 h-4 text-slate-400 absolute right-3.5 top-1/2 -translate-y-1/2 pointer-events-none"><path d="m6 9 6 6 6-6"></path></svg>
</div>
</div>
<div>
<label class="block text-xs font-bold text-slate-700 mb-1">ミッションタイトル</label>
<input class="w-full bg-slate-50/70 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#0d9488]" type="text" value="道頓堀川・戎橋周辺">
</div>
</div>
</section>
<!-- 解説文・フィールド写真カード -->
<section class="bg-white rounded-2xl p-5 border border-slate-200/90 shadow-xs space-y-4">
<div class="flex items-center justify-between pb-3 border-b border-slate-100">
<h2 class="font-bold text-sm text-slate-900 flex items-center gap-2">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="image" aria-hidden="true" class="lucide lucide-image w-4 h-4 text-[#0d9488]"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
<span class="">解説文・フィールド写真</span>
</h2>
</div>
<!-- メイン写真プレビュー -->
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="text-xs font-bold text-slate-700">メイン写真（現地手引き）</label>
<span class="text-[11px] text-slate-400">推奨比率 16:9</span>
</div>
<div class="relative rounded-2xl overflow-hidden border-2 border-dashed border-teal-300 bg-teal-50/60 aspect-video flex flex-col items-center justify-center cursor-pointer transition hover:bg-teal-50 group p-4">
  <div class="w-12 h-12 rounded-full bg-white shadow-sm flex items-center justify-center text-[#0d9488] mb-2 group-hover:scale-105 transition">
    <i class="w-6 h-6" data-lucide="upload-cloud"></i>
  </div>
  <p class="text-xs font-bold text-slate-800 mb-1">ここに写真・画像を追加</p>
  <p class="text-[11px] text-slate-500 text-center">クリックまたはドラッグ＆ドロップで画像を選択<br><span class="text-[10px] text-teal-700 font-medium">PNG, JPG または WEBP（推奨比率 16:9 / 最大 5MB）</span></p>
  <div class="absolute bottom-2 right-2 flex items-center gap-1.5">
    <button class="px-2.5 py-1 bg-white hover:bg-slate-50 text-slate-800 text-[11px] font-bold rounded-lg shadow-sm border border-slate-200 flex items-center gap-1 transition" type="button">
      <i class="w-3 h-3 text-[#0d9488]" data-lucide="image"></i> ファイル選択
    </button>
  </div>
</div>
</div>
<!-- スポット解説文 -->
<div>
<div class="flex items-center justify-between mb-1">
<label class="text-xs font-bold text-slate-700">スポット解説・事前学習のポイント</label>
<span class="text-[11px] text-slate-400 font-mono">142 / 300文字</span>
</div>
<textarea class="w-full bg-slate-50/70 border border-slate-200 rounded-xl p-3 text-xs leading-relaxed text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-[#0d9488]" rows="5">巨大な立体看板やネオンがひしめく「道頓堀」は、食とエンタメが集まる大阪・ミナミを代表する歓楽街です。幕府公認の演劇街として芝居小屋が集まり発展しました。「天下の台所」として経済の主導権を握った上方町人たちの独自の文化（元禄文化など）を現在に伝える一大発信地です。</textarea>
</div>
</section>
</div>
<!-- ===== 右カラム: 現地チェッククイズ設定 ===== -->
<div class="space-y-6">

<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="help-circle" aria-hidden="true" class="lucide lucide-help-circle w-4 h-4 text-[#0d9488]"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg>
<span class="">現地チェッククイズ設定</span>
</h2>
<span class="text-[11px] font-bold text-teal-800 bg-teal-50 border border-teal-200/80 px-2 py-0.5 rounded">4択方式</span>
</div>
<!-- 問題文入力 -->
<div>
<label class="block text-xs font-bold text-slate-700 mb-1">問題文入力</label>
<textarea class="w-full bg-slate-50/70 border border-slate-200 rounded-xl p-3 text-xs leading-relaxed text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-[#0d9488]" rows="3">Q. 道頓堀川はある川から水を引いて作られた人工の川です。その元となっている、琵琶湖から流れ出て大阪湾へと注ぐ川の名前は何でしょう？</textarea>
</div>
<!-- 選択肢と正解指定 -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="text-xs font-bold text-slate-700">選択肢と正解指定</label>
<span class="text-[10px] text-teal-700 font-semibold">※正解のラジオを選択</span>
</div>
<div class="space-y-2">
<!-- 選択肢 A -->
<label class="flex items-center gap-3 p-3 bg-slate-50 hover:bg-slate-100/70 rounded-xl border border-slate-200 cursor-pointer transition">
<input class="w-4 h-4 text-[#0d9488] focus:ring-[#0d9488]" name="quiz_answer" type="radio" value="A">
<span class="w-5 font-bold text-xs text-slate-600">A</span>
<input class="flex-1 bg-transparent border-none p-0 text-xs font-medium text-slate-800 focus:ring-0" type="text" value="利根川">
</label>
<!-- 選択肢 B -->
<label class="flex items-center gap-3 p-3 bg-slate-50 hover:bg-slate-100/70 rounded-xl border border-slate-200 cursor-pointer transition">
<input class="w-4 h-4 text-[#0d9488] focus:ring-[#0d9488]" name="quiz_answer" type="radio" value="B">
<span class="w-5 font-bold text-xs text-slate-600">B</span>
<input class="flex-1 bg-transparent border-none p-0 text-xs font-medium text-slate-800 focus:ring-0" type="text" value="信濃川">
</label>
<!-- 選択肢 C（正解） -->
<label class="flex items-center gap-3 p-3 bg-teal-50/60 rounded-xl border border-teal-300 cursor-pointer transition ring-1 ring-[#0d9488]/30">
<input checked="" class="w-4 h-4 text-[#0d9488] focus:ring-[#0d9488]" name="quiz_answer" type="radio" value="C">
<span class="w-5 font-bold text-xs text-[#0d9488]">C</span>
<input class="flex-1 bg-transparent border-none p-0 text-xs font-bold text-teal-900 focus:ring-0" type="text" value="淀川">
<span class="text-[10px] bg-[#0d9488] text-white font-bold px-2 py-0.5 rounded">正解</span>
</label>
<!-- 選択肢 D -->
<label class="flex items-center gap-3 p-3 bg-slate-50 hover:bg-slate-100/70 rounded-xl border border-slate-200 cursor-pointer transition">
<input class="w-4 h-4 text-[#0d9488] focus:ring-[#0d9488]" name="quiz_answer" type="radio" value="D">
<span class="w-5 font-bold text-xs text-slate-600">D</span>
<input class="flex-1 bg-transparent border-none p-0 text-xs font-medium text-slate-800 focus:ring-0" type="text" value="石狩川">
</label>
</div>
</div>
<!-- 正解後トリビア・解説 -->
<div>
<label class="block text-xs font-bold text-slate-700 mb-1">正解後トリビア・解説（生徒へのフィードバック）</label>
<textarea class="w-full bg-slate-50/70 border border-slate-200 rounded-xl p-3 text-xs leading-relaxed text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-[#0d9488]" rows="3">正解は【淀川】。安井道頓が私財を投じて淀川水系の東横堀川と木津川を結ぶ水路を開削したのが道頓堀川の始まりです。</textarea>
</div>

<div class="pt-3 border-t border-slate-100 flex items-center justify-end gap-3">
<button class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition flex items-center gap-1.5" type="button">
